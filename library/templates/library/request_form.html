{% extends "base.html" %}
{% block title %}Book: {{ book.title }}{% endblock %}
{% block content %}
  <h1>Book: "{{ book.title }}"</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Submit</button>
    <a href="{% url 'library:book_detail' book.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
