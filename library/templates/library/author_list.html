{% extends "base.html" %}
{% block title %}Authors{% endblock %}
{% block content %}
  <h1>Authors</h1>
  {% for a in authors %}
    <article class="book-card">
      <h2><a href="{% url 'library:author_detail' a.pk %}">{{ a.full_name }}</a></h2>
      <p class="category">{{ a.country }}{% if a.birth_year %} · {{ a.birth_year }}{% endif %}</p>
    </article>
  {% empty %}
    <p class="empty">No authors yet.</p>
  {% endfor %}
{% endblock %}
